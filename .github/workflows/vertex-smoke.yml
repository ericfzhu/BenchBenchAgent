name: Paid Vertex smoke test

on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write

jobs:
  smoke:
    environment: paid-vertex-smoke
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - run: python -m pip install -e .
      - run: bba epoch create --epoch-id paid-ci-smoke --evidence-root .bba
      - run: bba epoch preflight --epoch-id paid-ci-smoke --evidence-root .bba
