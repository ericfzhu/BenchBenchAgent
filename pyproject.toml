[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bba"
version = "0.5.0"
description = "BenchBenchAgent: two-sided, holdout-audited benchmark creation tournaments"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "AgentBenchBench Contributors" }
]
license = "MIT"
dependencies = [
    "anthropic[vertex]>=0.78.0,<1.0.0",
    "google-adk==2.6.3",
    "google-genai>=2.9.0,<3.0.0",
    "litellm>=1.84.0,<2.0.0",
]

[project.scripts]
bba = "bba.cli:main"

[tool.setuptools]
packages = ["bba"]
