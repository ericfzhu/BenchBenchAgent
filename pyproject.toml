[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bba"
version = "0.3.0"
description = "BenchBenchAgent: two-sided, holdout-audited benchmark creation tournaments"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "AgentBenchBench Contributors" }
]
license = "MIT"
dependencies = [
    "google-adk==2.6.3",
    "pydantic>=2.12.0,<3.0.0",
]

[project.scripts]
bba = "bba.cli:main"

[tool.setuptools]
packages = ["bba"]

[project.optional-dependencies]
vertex = [
    "google-genai>=2.9.0,<3.0.0",
]
all = [
    "google-genai>=2.9.0,<3.0.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
