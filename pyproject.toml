[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bba"
version = "0.13.0"
description = "BenchBenchAgent: two-sided, holdout-audited benchmark creation tournaments"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "AgentBenchBench Contributors" }
]
license = { text = "MIT" }
dependencies = [
    "anthropic[vertex]>=0.78.0,<1.0.0",
    "cryptography>=45.0.0,<51.0.0",
    "fastapi>=0.115.0,<1.0.0",
    "google-adk==2.6.3",
    "google-genai>=2.9.0,<3.0.0",
    "litellm>=1.84.0,<2.0.0",
    "opentelemetry-exporter-otlp-proto-http>=1.42.0,<=1.42.1",
    "python-multipart>=0.0.20,<1.0.0",
    "uvicorn>=0.34.0,<1.0.0",
]

[project.scripts]
bba = "bba.cli:main"

[tool.setuptools]
packages = ["bba"]

[tool.setuptools.package-data]
bba = ["data/*.json", "data/dependency-wheels/*.json", "data/dependency-wheels/*.whl"]
